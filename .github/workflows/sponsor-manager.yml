name: Sponsor Team Manager
on:
  repository_dispatch:
    types: [sponsorship]
  workflow_dispatch:
    inputs:
      test_username:
        description: 'GitHub username to test with'
        required: true
        default: 'francoios'
      test_tier:
        description: 'Tier name'
        required: true
        default: 'Backer'
      test_price:
        description: 'Monthly price in dollars'
        required: true
        default: '15'
      test_action:
        description: 'Action type'
        required: true
        default: 'created'
        type: choice
        options:
          - created
          - cancelled
          - tier_changed
          - pending_cancellation

# One run per sponsor, and never cancel an in-flight grant.
# (The old shared group meant two sponsors signing up together
#  could cancel each other's run and silently lose access.)
concurrency:
  group: sponsor-manager-${{ github.event.client_payload.sponsorship.sponsor.login || github.event.inputs.test_username || github.run_id }}
  cancel-in-progress: false

jobs:
  manage-sponsor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Handle sponsor event
        uses: actions/github-script@v7
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        with:
          github-token: ${{ secrets.ORG_ADMIN_TOKEN }}
          script: |
            const org = 'AnkleBreaker-Studio';
            const teamSlug = 'sponsors';
            const MIN_TIER_PRICE = 15;
            const PRIORITY_TIER_PRICE = 100;
            const DISCORD_CHANNEL = '1476975591692435620';
            const INVITE_URL = 'https://github.com/orgs/AnkleBreaker-Studio/invitation';
            const CLAIM_URL = 'https://github.com/AnkleBreaker-Studio/premium-mcps/issues/new?template=discord-role-request.yml';

            let sponsor, tierName, tierPrice, action;
            if (context.eventName === 'repository_dispatch') {
              const payload = context.payload.client_payload;
              sponsor = payload.sponsorship.sponsor.login;
              tierName = payload.sponsorship.tier.name;
              tierPrice = payload.sponsorship.tier.monthly_price_in_dollars;
              action = payload.action;
              console.log(`Webhook event: ${action} from ${sponsor}`);
            } else {
              sponsor = '${{ github.event.inputs.test_username }}';
              tierName = '${{ github.event.inputs.test_tier }}';
              tierPrice = parseInt('${{ github.event.inputs.test_price }}');
              action = '${{ github.event.inputs.test_action }}';
              console.log(`Manual test: ${action} for ${sponsor}`);
            }

            async function postDiscord(message) {
              try {
                const resp = await fetch(
                  `https://discord.com/api/v10/channels/${DISCORD_CHANNEL}/messages`,
                  {
                    method: 'POST',
                    headers: {
                      'Authorization': `Bot ${process.env.DISCORD_BOT_TOKEN}`,
                      'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: message })
                  }
                );
                if (!resp.ok) {
                  console.error(`Discord error ${resp.status}: ${await resp.text()}`);
                  return false;
                }
                return true;
              } catch (e) {
                console.error(`Discord post failed: ${e.message}`);
                return false;
              }
            }

            async function removeFromTeam(reason) {
              try {
                await github.rest.teams.removeMembershipForUserInOrg({ org, team_slug: teamSlug, username: sponsor });
                console.log(`Removed ${sponsor} from ${teamSlug} (${reason})`);
              } catch (error) {
                console.log(`Note: ${sponsor} may not have been in team (${error.message})`);
              }
            }

            const HANDLED = ['created', 'tier_changed', 'cancelled', 'pending_cancellation'];
            if (!HANDLED.includes(action)) {
              console.log(`No-op: action "${action}" is not handled by this workflow.`);
              return;
            }

            if (action === 'cancelled' || action === 'pending_cancellation') {
              await removeFromTeam(action);
              return;
            }

            if (tierPrice < MIN_TIER_PRICE) {
              if (action === 'tier_changed') {
                await removeFromTeam(`tier dropped to $${tierPrice}`);
              } else {
                console.log(`Ignoring ${action}: $${tierPrice} is below the $${MIN_TIER_PRICE} threshold.`);
              }
              return;
            }

            // addOrUpdateMembershipForUserInOrg returns state "pending" for anyone
            // who is not already an org member. Pending means NO repo access yet.
            let membershipState = 'unknown';
            try {
              const resp = await github.rest.teams.addOrUpdateMembershipForUserInOrg({
                org, team_slug: teamSlug, username: sponsor, role: 'member'
              });
              membershipState = resp.data.state;
              console.log(`Team membership for ${sponsor}: ${membershipState}`);
            } catch (error) {
              console.error(`Failed to add ${sponsor}: ${error.message}`);
              await postDiscord(
                `⚠️ **Sponsor access FAILED** for \`${sponsor}\` (${tierName}, $${tierPrice}/mo).\n` +
                `Could not add them to the \`${teamSlug}\` team: ${error.message}\n` +
                `Manual action needed.`
              );
              core.setFailed(`Failed to add ${sponsor} to ${teamSlug}: ${error.message}`);
              return;
            }

            if (action !== 'created') {
              console.log(`Tier change processed for ${sponsor}; no announcement sent.`);
              return;
            }

            const isPriority = tierPrice >= PRIORITY_TIER_PRICE;
            const roleLabel = isPriority ? 'MCP Priority Support' : 'Private MCP Sponsor';
            const header = isPriority
              ? '## 🔴 New MCP Priority Support Subscriber!'
              : '## 🎉 New Sponsor!';
            const welcome = isPriority
              ? `**${sponsor}** just joined as an **${tierName}** subscriber! Welcome to the inner circle! ❤️`
              : `**${sponsor}** just joined as a **${tierName}** sponsor! Welcome to the AnkleBreaker Studio family! ❤️`;

            let steps;
            if (membershipState === 'pending') {
              steps =
                `**👉 ${sponsor}, two quick steps to unlock everything:**\n` +
                `**1.** Accept your GitHub organisation invite → <${INVITE_URL}>\n` +
                `_Until you accept it, the premium repos show a **404**. That is expected, not a bug._\n` +
                `**2.** Then claim your **${roleLabel}** Discord role → <${CLAIM_URL}>`;
            } else {
              steps =
                `**👉 ${sponsor}, one step left:**\n` +
                `Claim your **${roleLabel}** Discord role → <${CLAIM_URL}>`;
            }

            const sent = await postDiscord(
              `${header}\n\n${welcome}\n\n` +
              `Thank you for supporting our MCP tools and open-source projects! 🚀\n\n` +
              steps
            );
            if (!sent) {
              core.setFailed('Access was granted but the Discord announcement failed to post.');
            }
